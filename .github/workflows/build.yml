name: Build and Release Real-Time Chess Reviewer

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Accept Android SDK licenses
      run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'

    - name: Download Stockfish (Android armv8 / arm64)
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p sf app/src/main/jniLibs/arm64-v8a
        for tag in $(gh release list -R official-stockfish/Stockfish -L 30 --json tagName -q '.[].tagName'); do
          if gh release download "$tag" -R official-stockfish/Stockfish -p 'stockfish-android-armv8.tar*' -D sf 2>/dev/null; then
            echo "Downloaded engine from release $tag"
            break
          fi
        done
        ls -l sf
        for f in sf/*.tar sf/*.tar.gz; do
          if [ -e "$f" ]; then tar -xf "$f" -C sf; fi
        done
        BIN=$(find sf -type f -name 'stockfish-android-armv8' | head -n 1)
        test -n "$BIN" || { echo "Stockfish binary not found"; find sf; exit 1; }
        cp "$BIN" app/src/main/jniLibs/arm64-v8a/libstockfish.so
        chmod +x app/src/main/jniLibs/arm64-v8a/libstockfish.so

    - name: Decode signing keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
          echo "Missing secrets KEYSTORE_BASE64 and/or KEYSTORE_PASSWORD (repo Settings > Secrets and variables > Actions)"
          exit 1
        fi
        echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

    - name: Build signed release APK
      env:
        KEYSTORE_PATH: ${{ runner.temp }}/release.jks
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: chessreviewer
        KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      run: gradle assembleRelease --stacktrace

    - name: Rename APK
      run: cp app/build/outputs/apk/release/app-release.apk ChessReviewer.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ChessReviewer
        path: ChessReviewer.apk
        if-no-files-found: error

    - name: Publish GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "build-${{ github.run_number }}" ChessReviewer.apk \
          --title "Chess Reviewer build ${{ github.run_number }}" \
          --notes "Signed release build from commit ${{ github.sha }}. Download ChessReviewer.apk and install it."
