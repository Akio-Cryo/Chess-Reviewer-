name: Build Real-Time Chess Reviewer App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'

    - name: Download Stockfish (Android arm64 universal)
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p sf app/src/main/jniLibs/arm64-v8a
        for tag in $(gh release list -R official-stockfish/Stockfish -L 30 --json tagName -q '.[].tagName'); do
          if gh release download "$tag" -R official-stockfish/Stockfish -p 'stockfish-android-arm64-universal*' -D sf 2>/dev/null; then
            echo "Downloaded engine from release $tag"
            break
          fi
        done
        for f in sf/*.tar sf/*.tar.gz; do [ -e "$f" ] && tar -xf "$f" -C sf; done
        BIN=$(find sf -type f -name 'stockfish-android-arm64-universal' | head -n 1)
        test -n "$BIN" || { echo "Stockfish binary not found"; exit 1; }
        cp "$BIN" app/src/main/jniLibs/arm64-v8a/libstockfish.so
        chmod +x app/src/main/jniLibs/arm64-v8a/libstockfish.so
        ls -l app/src/main/jniLibs/arm64-v8a/

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
